site_name: UniPico
site_description: Didattica universitaria liberata
site_url: https://unipico.codeberg.page/
repo_url: https://codeberg.org/unipico/pages
repo_name: unipico/pages
site_dir: _site
remote_name: origin
remote_branch: pages

theme:
  name: material
  language: it
  logo: assets/unipico_logo.svg
  favicon: assets/unipico_logo.svg
  font: false
  palette:
    - scheme: unipico
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Manifesto: manifesto.md
  - Catalogo: catalogue.md
  - Per i docenti:
      - Linee guida: contribute.md
      - Guide pratiche: tutorials.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - stylesheets/extra.css

copyright: Contenuto rilasciato sotto la licenza CC BY-SA 4.0 a meno che non sia specificato diversamente
